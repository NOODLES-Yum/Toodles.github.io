<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgiveness Letter</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ffd6e7,#ffeef5);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  text-align:center;
  max-width:400px;
  position:relative;
}

button{
  padding:10px 20px;
  margin:10px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

.yes{
  background:#ff4d88;
  color:white;
}

.no{
  background:#888;
  color:white;
  position:absolute;
}
</style>
</head>

<body>

<div class="container">

<img src="photo.jpg" width="250">

<p>diko spy diman ko spy P</p>

<p>Pasaylo?</p>

<button class="yes" onclick="sendAnswer('yes')">Yes</button>
<button class="no" id="noButton">No</button>

<p id="responseText"></p>

</div>

<script>

const noBtn = document.getElementById("noButton");

noBtn.addEventListener("mouseover", moveButton);

function moveButton(){

  const container = document.querySelector(".container");

  const maxX = container.clientWidth - noBtn.clientWidth;
  const maxY = container.clientHeight - noBtn.clientHeight;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  noBtn.style.left = randomX + "px";
  noBtn.style.top = randomY + "px";
}

function sendAnswer(answer){
  document.getElementById("responseText").innerText = "Salamat kayoerns 💖";
}

</script>

</body>
</html>
